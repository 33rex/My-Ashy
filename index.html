  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap');

    :root{
      --bg:#ffe4f0;
      --accent:#ec4899;
      --muted:#a855f7;
      font-family: 'Dancing Script', cursive;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg,#ffd4e5 0%, #ffecf3 100%);
      color: #3b0a2e;
      overflow-y: auto; /* Scrollen erlauben */
    }

    .wrap{
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      position: relative;
    }

    .stage{
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 1;
    }

    /* Klickbereiche */
    .button-grid{
      display:flex;
      justify-content:center;
      gap:24px;
      width:100%;
      flex-wrap: wrap; /* Buttons umbrechen bei kleinen Geräten */
    }

    .jug-card{
      width: 200px;
      max-width: 45%; /* kleiner auf Handys */
      height: 90px;
      border-radius: 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      cursor:pointer;
      background:rgba(255,255,255,0.7);
      box-shadow:0 10px 40px rgba(0,0,0,0.25);
      transition: transform .2s ease, box-shadow .2s ease;
      flex-shrink:0;
      margin-bottom: 16px; /* Abstand, wenn umbrechen */
    }

    .jug-card:hover{
      animation:shake 0.4s ease-in-out infinite;
      box-shadow:0 12px 50px rgba(0,0,0,0.35);
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(2deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-2deg); }
      100% { transform: rotate(0deg); }
    }

    .click-text{
      font-size:24px;
      font-weight:600;
      color:var(--accent);
      user-select:none;
      pointer-events:none;
      text-align:center;
    }

    /* Zettel (oben im Bildschirm) */
    .zettel{
      position:fixed;
      top:40px;
      left:50%;
      transform:translateX(-50%);
      background:white;
      color:#3b0a2e;
      padding:16px 24px;
      border-radius:14px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      font-weight:600;
      font-size:24px;
      display:none;
      text-align:center;
      z-index:100;
    }
    .zettel.show{
      display:block;
      animation:pop .3s ease;
    }
    @keyframes pop {
      from {transform:translateX(-50%) translateY(-10px) scale(.92);opacity:0}
      to {transform:translateX(-50%) translateY(0) scale(1);opacity:1}
    }

    .hint{
      color:var(--muted);
      font-size:16px;
      text-align:center;
      margin-top:12px;
    }

    /* Herzanimationen */
    .heart{
      position:absolute;
      bottom:-20px;
      font-size:24px;
      color:var(--accent);
      opacity:0.7;
      animation:floatUp 6s linear infinite;
    }
    @keyframes floatUp {
      0% {transform:translateY(0) scale(1); opacity:0.7;}
      50% {opacity:1;}
      100% {transform:translateY(-110vh) scale(1.4); opacity:0;}
    }

    /* Responsive Anpassungen */
    @media (max-width: 500px) {
      .jug-card {
        width: 80%; /* auf sehr kleinen Bildschirmen */
        height: 70px;
      }
      .click-text {
        font-size: 18px;
      }
      .zettel {
        font-size: 20px;
        padding: 12px 16px;
      }
    }
  </style>
</head>
